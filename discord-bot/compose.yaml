services:
  discord-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: bfwg-discord-bot:latest
    container_name: bfwg-discord-bot
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      SUMMARIES_DIR: ${SUMMARIES_DIR:-/app/summaries}
    volumes:
      - ../summaries:/app/summaries:ro
      - bot-state:/app/state

volumes:
  bot-state:
